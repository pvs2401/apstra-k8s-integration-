apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: to-rack1-leaf1
  namespace: metallb-system
spec:
  myASN: 64999
  peerASN: 64102
  peerAddress: 10.1.10.201     # Leaf1 BGP IP
  nodeSelectors:
  - matchLabels:
      kubernetes.io/hostname: worker1
---
