# prod-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: prod-websocket-route
  namespace: default
spec:
  parentRefs:
  - name: tenant1-envoy-gw
    namespace: default
    sectionName: https
  hostnames:
  - "prod.tenant1.dev"
  rules:
  # WebSocket upgrade rule
  - matches:
    - path:
        type: PathPrefix
        value: /ws
      headers:
      - name: "Connection"
        value: "Upgrade"
      - name: "Upgrade"
        value: "websocket"
    backendRefs:
    - name: websocket-echo-tenant1-prod-service
      port: 80
      weight: 100
    - name: prod-fallback-service
      port: 80
      weight: 0
  # Regular HTTP rule
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: websocket-echo-tenant1-prod-service
      port: 80
      weight: 100
    - name: prod-fallback-service
      port: 80
      weight: 0
---
# HTTP to HTTPS redirect for production
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: prod-websocket-redirect
  namespace: default
spec:
  parentRefs:
  - name: prod-websocket-gateway
    namespace: default
    sectionName: http-redirect
  hostnames:
  - "prod.tenant1.dev"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
