# qa-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qa-websocket-route
  namespace: default
spec:
  parentRefs:
  - name: qa-websocket-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "qa.sandbox.dev"
  rules:
  # WebSocket upgrade rule
  - matches:
    - path:
        type: PathPrefix
        value: /ws
      headers:
      - name: "Connection"
        value: "Upgrade"
      - name: "Upgrade"
        value: "websocket"
    backendRefs:
    - name: websocket-echo-custom-qa-service
      port: 80
      weight: 100
    - name: qa-fallback-service
      port: 80
      weight: 0
  # Regular HTTP rule  
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: websocket-echo-custom-qa-service
      port: 80
      weight: 100
    - name: qa-fallback-service
      port: 80
      weight: 0
---
# HTTP to HTTPS redirect for QA
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qa-websocket-redirect
  namespace: default
spec:
  parentRefs:
  - name: qa-websocket-gateway
    namespace: default
    sectionName: http-redirect
  hostnames:
  - "qa.sandbox.dev"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
