# qa-websocket-app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-echo-custom-qa
  labels:
    app: websocket-echo-custom-qa
    env: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket-echo-custom-qa
      env: qa
  template:
    metadata:
      labels:
        app: websocket-echo-custom-qa
        env: qa
    spec:
      containers:
      - name: websocket-server
        image: vshenoy83/websocket-echo-headers:v1.0.1
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: ENVIRONMENT
          value: "QA"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-echo-custom-qa-service
  labels:
    app: websocket-echo-custom-qa
    env: qa
spec:
  selector:
    app: websocket-echo-custom-qa
    env: qa
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
